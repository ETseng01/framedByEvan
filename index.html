<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>framedByEvan</title>
  <meta name="EvanTseng" content="Photo Gallery">
  <meta name="author" content="Evan Tseng">
  <link rel="stylesheet" href="css/styles.css?v=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />

  <style>
    #lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #lightbox img {
      max-width: 90%;
      max-height: 90%;
    }

    #lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      z-index: 1001;
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <div class="logo">
      <a href="index.html">
        <img src="framedByEkans.svg">

      </a>
    </div>


    <div class="nav-links">
      <a href="index.html">Portfolio</a>
      <a href="equipment.html">My Equipment</a>
    </div>
  </nav>






  <div id="gallery"></div>

  <div id="lightbox" onclick="closeLightbox()">
    <div id="lightbox-close" onclick="closeLightbox()">×</div>
    <img id="lightbox-img" src="" alt="Lightbox Image">
  </div>

  <script>
    fetch('/photos.json')
      .then(response => response.json())
      .then(images => {
        const gallery = document.getElementById('gallery');

        images.forEach(image => {
          const img = document.createElement('img');
          img.src = `photos/${image}`;
          img.loading = "lazy";
          img.onclick = (event) => openLightbox(`photos/${image}`, event);
          gallery.appendChild(img);
        });
      });

    function resizeAllGridItems() {
      const grid = document.getElementById("gallery");
      const rowHeight = parseInt(
        window.getComputedStyle(grid).getPropertyValue("grid-auto-rows")
      );
      const rowGap = parseInt(
        window.getComputedStyle(grid).getPropertyValue("gap")
      );

      grid.querySelectorAll("img").forEach((item) => {
        const rowSpan = Math.ceil(
          (item.getBoundingClientRect().height + rowGap) /
          (rowHeight + rowGap)
        );
        item.style.gridRowEnd = "span " + rowSpan;
      });
    }

    window.addEventListener("load", resizeAllGridItems);
    window.addEventListener("resize", resizeAllGridItems);

  </script>


</body>

</html>
